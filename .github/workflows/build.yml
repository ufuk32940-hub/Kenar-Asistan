name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Projeyi olustur
        run: |
          echo "" | base64 -d | tar xz
      - name: Derle
        working-directory: KenarAsistan
        run: gradle assembleDebug --no-daemon
      - name: APK dosyasini yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" KenarAsistan/app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "Kenar Asistan APK" --notes "app-debug.apk dosyasini indirip kur."
